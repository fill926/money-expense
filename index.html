<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex justify-center items-start pt-10 px-4 pb-10">

    <!-- LOGIN SCREEN (WALLET ID) -->
    <div id="loginScreen" class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-gray-100 p-8 text-center transition-all">
        <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
            <i class="fas fa-wallet"></i>
        </div>
        <h2 class="text-2xl font-bold text-gray-800 mb-2">Open Wallet</h2>
        <p class="text-gray-500 mb-6 text-sm">Enter a unique code (Wallet ID) to open or create a new expense tracker.</p>
        
        <form id="loginForm" class="space-y-4">
            <input type="text" id="walletIdInput" required placeholder="Example: family-wallet" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all text-center font-medium">
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition-colors shadow-sm">
                Open Tracker
            </button>
        </form>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="appScreen" class="w-full max-w-md hidden">
        <!-- Header -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-4 relative">
            <button id="logoutBtn" class="absolute top-4 right-4 text-gray-400 hover:text-red-500 text-sm flex items-center gap-1 transition-colors">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
            <p class="text-gray-500 text-sm font-medium mb-1">Monthly Total</p>
            <h1 id="totalAmount" class="text-3xl font-bold text-gray-800">Rp 0</h1>
            <p class="text-xs text-gray-400 mt-2">Wallet ID: <span id="displayWalletId" class="font-semibold text-gray-600"></span></p>
        </div>

        <!-- Add Expense Form -->
        <form id="expenseForm" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-4 space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wider">Date</label>
                    <input type="date" id="expenseDate" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wider">Amount (Rp)</label>
                    <input type="number" id="amount" required min="1" placeholder="Ex: 50000" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all">
                </div>
            </div>
            
            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wider">Category</label>
                <select id="category" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all bg-white">
                    <option value="" disabled selected>Select category...</option>
                    <option value="Food">🍔 Food & Beverage</option>
                    <option value="Transportation">🚗 Transportation</option>
                    <option value="Shopping">🛍️ Shopping</option>
                    <option value="Entertainment">🎬 Entertainment</option>
                    <option value="Bills">📄 Bills</option>
                    <option value="Others">📦 Others</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wider">Note</label>
                <input type="text" id="note" required placeholder="Example: Lunch" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition-colors shadow-sm flex justify-center items-center gap-2">
                <i class="fas fa-plus"></i> Add Expense
            </button>
        </form>

        <!-- Expense History -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-sm font-bold text-gray-800">Expense History</h3>
                <!-- Month Picker -->
                <input type="month" id="monthFilter" class="text-sm font-medium text-gray-600 border border-gray-200 rounded-lg px-3 py-1.5 outline-none focus:border-blue-500 transition-all bg-gray-50 hover:bg-white">
            </div>
            <div id="expenseList" class="space-y-3">
                <p class="text-center text-gray-400 text-sm py-4">No records yet.</p>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
