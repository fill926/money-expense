<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex justify-center items-start pt-10 px-4 pb-10">

    <!-- LOGIN SCREEN (WALLET ID) -->
    <div id="loginScreen" class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-gray-100 p-8 text-center transition-all">
        <h2 class="text-2xl font-bold text-gray-800 mb-2">Open Wallet</h2>
        <p class="text-gray-500 mb-6 text-sm">Enter a unique code (Wallet ID) to open or create a new expense tracker.</p>
        
        <form id="loginForm" class="space-y-4">
            <input type="text" id="walletIdInput" required placeholder="Example: family-wallet" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all text-center font-medium">
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition-colors shadow-sm">
                Open Tracker
            </button>
        </form>
    </div>

    <!-- APP SCREEN CONTAINS TWO VIEWS -->
    <div id="appScreen" class="w-full max-w-md hidden relative">
        
        <!-- ==================== MAIN VIEW ==================== -->
        <div id="mainView" class="transition-all block">
            <!-- Header -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-4 relative">
                <button id="logoutBtn" class="absolute top-4 right-4 text-gray-400 hover:text-red-500 text-sm font-medium transition-colors">
                    Logout
                </button>
                <p class="text-gray-500 text-sm font-medium mb-1">This Month's Total</p>
                <h1 id="totalAmount" class="text-3xl font-bold text-gray-800">Rp 0</h1>
                <p class="text-xs text-gray-400 mt-2">Wallet ID: <span id="displayWalletId" class="font-semibold text-gray-600"></span></p>
            </div>

            <!-- Add Expense Form -->
            <form id="expenseForm" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-4 space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wider">Date</label>
                        <input type="date" id="expenseDate" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wider">Amount (Rp)</label>
                        <input type="number" id="amount" required min="1" placeholder="Ex: 50000" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all text-sm">
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wider">Category</label>
                        <select id="category" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all bg-white text-sm">
                            <option value="" disabled selected>Select...</option>
                            <option value="Lunch">Lunch</option>
                            <option value="Dinner">Dinner</option>
                            <option value="Snacks">Snacks And Drinks</option>
                            <option value="Sports">Sports</option>
                            <option value="Savings">Savings</option>
                            <option value="Investment">Investment</option>
                            <option value="Medical">Medical</option>
                            <option value="Transportation">Transportation</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wider">Account/Bank</label>
                        <select id="bankType" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all bg-white text-sm">
                            <option value="" disabled selected>Select...</option>
                            <option value="Cash">Cash</option>
                            <option value="BCA">BCA</option>
                            <option value="Mandiri">Mandiri</option>
                            <option value="BNI">BNI</option>
                            <option value="BRI">BRI</option>
                            <option value="Superbank">Superbank</option>
                            <option value="e-Wallet">e-Wallet</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wider">Note</label>
                    <input type="text" id="note" required placeholder="Example: Nasi Goreng" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all text-sm">
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition-colors shadow-sm mt-2">
                    Add Expense
                </button>
            </form>

            <!-- Recent Expenses (Max 3) -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                <h3 class="text-sm font-bold text-gray-800 mb-4">Recent Expenses</h3>
                <div id="recentExpenseList" class="space-y-3 mb-4">
                    <p class="text-center text-gray-400 text-sm py-4">No records yet.</p>
                </div>
                <button id="goToHistoryBtn" class="w-full bg-gray-50 hover:bg-gray-100 text-gray-600 font-semibold py-2.5 rounded-xl transition-colors text-sm border border-gray-200">
                    View Full History
                </button>
            </div>
        </div>


        <!-- ==================== HISTORY VIEW ==================== -->
        <div id="historyView" class="transition-all hidden">
            <!-- Back & Header -->
            <div class="flex items-center gap-3 mb-4 px-2">
                <button id="backToMainBtn" class="w-10 h-10 bg-white rounded-full shadow-sm border border-gray-100 flex items-center justify-center text-gray-600 hover:text-blue-600 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
                    </svg>
                </button>
                <h2 class="text-xl font-bold text-gray-800">Expense History</h2>
            </div>

            <!-- Filters & Total -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-4">
                <div class="flex gap-2 mb-4">
                    <input type="month" id="historyMonthFilter" class="flex-1 text-sm font-medium text-gray-600 border border-gray-200 rounded-lg px-3 py-2 outline-none focus:border-blue-500 transition-all bg-gray-50">
                    <button id="showAllTimeBtn" class="px-4 py-2 bg-blue-50 hover:bg-blue-100 text-blue-600 font-semibold rounded-lg text-sm transition-colors border border-blue-200">
                        All Time
                    </button>
                </div>
                <p class="text-gray-500 text-xs font-medium mb-1 uppercase tracking-wider" id="historyTotalLabel">Total for Selected</p>
                <h2 id="historyTotalAmount" class="text-2xl font-bold text-gray-800">Rp 0</h2>
            </div>

            <!-- Full List -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                <div id="fullExpenseList" class="space-y-3">
                    <p class="text-center text-gray-400 text-sm py-4">No records found.</p>
                </div>
            </div>
        </div>

    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
